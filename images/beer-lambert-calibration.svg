<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 800 560"
    role="img"
    aria-labelledby="title description"
>
    <title id="title">Absorbance calibration curve</title>

    <desc id="description">
        A linear graph shows that absorbance increases directly with
        concentration.
    </desc>

    <defs>
        <marker
            id="axis-arrow"
            markerWidth="10"
            markerHeight="10"
            refX="8"
            refY="3"
            orient="auto"
        >
            <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>
        </marker>
    </defs>

    <rect width="800" height="560" fill="#ffffff"/>

    <text
        x="400" y="40"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="25"
        font-weight="bold"
        fill="#1f2937"
    >
        Absorbance Calibration Curve
    </text>

    <!-- Grid -->
    <g stroke="#dbe3ec" stroke-width="1">
        <line x1="120" y1="110" x2="700" y2="110"/>
        <line x1="120" y1="190" x2="700" y2="190"/>
        <line x1="120" y1="270" x2="700" y2="270"/>
        <line x1="120" y1="350" x2="700" y2="350"/>
        <line x1="120" y1="430" x2="700" y2="430"/>

        <line x1="235" y1="90" x2="235" y2="430"/>
        <line x1="350" y1="90" x2="350" y2="430"/>
        <line x1="465" y1="90" x2="465" y2="430"/>
        <line x1="580" y1="90" x2="580" y2="430"/>
        <line x1="695" y1="90" x2="695" y2="430"/>
    </g>

    <!-- Axes -->
    <line
        x1="120" y1="430" x2="725" y2="430"
        stroke="#1f2937" stroke-width="3"
        marker-end="url(#axis-arrow)"
    />

    <line
        x1="120" y1="430" x2="120" y2="75"
        stroke="#1f2937" stroke-width="3"
        marker-end="url(#axis-arrow)"
    />

    <!-- Best-fit line -->
    <line
        x1="120" y1="430" x2="695" y2="110"
        stroke="#1e3a5f" stroke-width="6"
    />

    <!-- Data points -->
    <g fill="#991b1b">
        <circle cx="120" cy="430" r="8"/>
        <circle cx="235" cy="366" r="8"/>
        <circle cx="350" cy="302" r="8"/>
        <circle cx="465" cy="238" r="8"/>
        <circle cx="580" cy="174" r="8"/>
        <circle cx="695" cy="110" r="8"/>
    </g>

    <!-- Axis labels -->
    <text
        x="420" y="520"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="19"
        font-weight="bold"
        fill="#1f2937"
    >
        Concentration
    </text>

    <text
        x="42" y="270"
        text-anchor="middle"
        transform="rotate(-90 42 270)"
        font-family="Arial, sans-serif"
        font-size="19"
        font-weight="bold"
        fill="#1f2937"
    >
        Absorbance
    </text>

    <text
        x="530" y="105"
        font-family="Arial, sans-serif"
        font-size="17"
        font-weight="bold"
        fill="#1e3a5f"
    >
        A ∝ concentration
    </text>
</svg>
