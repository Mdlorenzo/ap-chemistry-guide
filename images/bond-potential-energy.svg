<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 800 480"
    role="img"
    aria-labelledby="graph-title graph-description"
>
    <title id="graph-title">
        Bond potential-energy curve
    </title>

    <desc id="graph-description">
        Potential energy decreases as two atoms approach, reaches a minimum
        at the equilibrium bond length, and rises sharply when the atoms
        become too close.
    </desc>

    <defs>
        <marker
            id="arrow"
            markerWidth="10"
            markerHeight="10"
            refX="5"
            refY="3"
            orient="auto"
        >
            <path d="M0,0 L0,6 L6,3 z" fill="#1e3a5f"/>
        </marker>
    </defs>

    <rect width="800" height="480" fill="#ffffff"/>

    <text
        x="400"
        y="35"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="23"
        font-weight="bold"
        fill="#1f2937"
    >
        Bond Potential Energy
    </text>

    <!-- Axes -->
    <line
        x1="95" y1="390" x2="745" y2="390"
        stroke="#1f2937" stroke-width="3"
    />

    <line
        x1="95" y1="390" x2="95" y2="65"
        stroke="#1f2937" stroke-width="3"
    />

    <!-- Zero-energy reference -->
    <line
        x1="95" y1="155" x2="745" y2="155"
        stroke="#94a3b8" stroke-width="2"
        stroke-dasharray="8 7"
    />

    <text
        x="82"
        y="160"
        text-anchor="end"
        font-family="Arial, sans-serif"
        font-size="15"
        fill="#4b5563"
    >
        0
    </text>

    <text
        x="655"
        y="140"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="15"
        fill="#4b5563"
    >
        Separated atoms
    </text>

    <!-- Potential-energy curve -->
    <path
        d="M135 72
           C155 160, 190 320, 295 350
           C365 350, 390 210, 455 175
           C525 145, 625 153, 725 155"
        fill="none"
        stroke="#1e3a5f"
        stroke-width="6"
        stroke-linecap="round"
    />

    <!-- Equilibrium bond-length line -->
    <line
        x1="295" y1="350" x2="295" y2="390"
        stroke="#991b1b" stroke-width="2"
        stroke-dasharray="6 5"
    />

    <circle cx="295" cy="350" r="7" fill="#991b1b"/>

    <text
        x="295"
        y="420"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="15"
        font-weight="bold"
        fill="#991b1b"
    >
        Equilibrium bond length
    </text>

    <!-- Bond-energy arrow -->
    <line
        x1="355" y1="158" x2="355" y2="344"
        stroke="#1e3a5f"
        stroke-width="3"
        marker-start="url(#arrow)"
        marker-end="url(#arrow)"
    />

    <text
        x="374"
        y="255"
        font-family="Arial, sans-serif"
        font-size="16"
        font-weight="bold"
        fill="#1e3a5f"
    >
        Bond energy
    </text>

    <!-- Repulsion label -->
    <text
        x="155"
        y="95"
        font-family="Arial, sans-serif"
        font-size="15"
        font-weight="bold"
        fill="#991b1b"
    >
        Strong repulsion
    </text>

    <!-- Axis labels -->
    <text
        x="420"
        y="462"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="18"
        font-weight="bold"
        fill="#1f2937"
    >
        Internuclear Distance
    </text>

    <text
        x="28"
        y="235"
        text-anchor="middle"
        transform="rotate(-90 28 235)"
        font-family="Arial, sans-serif"
        font-size="18"
        font-weight="bold"
        fill="#1f2937"
    >
        Potential Energy
    </text>
</svg>
