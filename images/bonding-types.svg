<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 960 420"
    role="img"
    aria-labelledby="title description"
>
    <title id="title">Comparison of chemical bonding</title>

    <desc id="description">
        Three diagrams comparing ionic bonding, covalent bonding,
        and metallic bonding.
    </desc>

    <rect width="960" height="420" fill="#f8fafc"/>

    <!-- Ionic bonding panel -->
    <rect
        x="20" y="20" width="290" height="380"
        rx="12" fill="#ffffff" stroke="#cbd9e8" stroke-width="2"
    />

    <text
        x="165" y="60" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="24"
        font-weight="bold" fill="#1e3a5f"
    >
        Ionic Bonding
    </text>

    <circle cx="105" cy="180" r="48" fill="#dbeafe" stroke="#1e3a5f" stroke-width="3"/>
    <circle cx="225" cy="180" r="55" fill="#fee2e2" stroke="#991b1b" stroke-width="3"/>

    <text
        x="105" y="188" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="23"
        font-weight="bold" fill="#1e3a5f"
    >
        Na+
    </text>

    <text
        x="225" y="188" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="23"
        font-weight="bold" fill="#991b1b"
    >
        Cl−
    </text>

    <line x1="155" y1="180" x2="168" y2="180" stroke="#1f2937" stroke-width="4"/>

    <text
        x="165" y="285" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="17" fill="#1f2937"
    >
        Attraction between
    </text>

    <text
        x="165" y="310" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="17" fill="#1f2937"
    >
        oppositely charged ions
    </text>

    <text
        x="165" y="355" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="16"
        font-weight="bold" fill="#1e3a5f"
    >
        Electron transfer forms ions
    </text>

    <!-- Covalent bonding panel -->
    <rect
        x="335" y="20" width="290" height="380"
        rx="12" fill="#ffffff" stroke="#cbd9e8" stroke-width="2"
    />

    <text
        x="480" y="60" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="24"
        font-weight="bold" fill="#1e3a5f"
    >
        Covalent Bonding
    </text>

    <circle cx="420" cy="180" r="48" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
    <circle cx="540" cy="180" r="48" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>

    <text
        x="420" y="188" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="25"
        font-weight="bold" fill="#0369a1"
    >
        H
    </text>

    <text
        x="540" y="188" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="25"
        font-weight="bold" fill="#0369a1"
    >
        H
    </text>

    <circle cx="472" cy="174" r="6" fill="#1f2937"/>
    <circle cx="488" cy="174" r="6" fill="#1f2937"/>

    <text
        x="480" y="285" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="17" fill="#1f2937"
    >
        Both nuclei attract the
    </text>

    <text
        x="480" y="310" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="17" fill="#1f2937"
    >
        shared electron pair
    </text>

    <text
        x="480" y="355" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="16"
        font-weight="bold" fill="#1e3a5f"
    >
        Electrons are shared
    </text>

    <!-- Metallic bonding panel -->
    <rect
        x="650" y="20" width="290" height="380"
        rx="12" fill="#ffffff" stroke="#cbd9e8" stroke-width="2"
    />

    <text
        x="795" y="60" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="24"
        font-weight="bold" fill="#1e3a5f"
    >
        Metallic Bonding
    </text>

    <g fill="#dbeafe" stroke="#1e3a5f" stroke-width="2">
        <circle cx="720" cy="140" r="29"/>
        <circle cx="795" cy="140" r="29"/>
        <circle cx="870" cy="140" r="29"/>

        <circle cx="720" cy="220" r="29"/>
        <circle cx="795" cy="220" r="29"/>
        <circle cx="870" cy="220" r="29"/>
    </g>

    <g
        font-family="Arial, sans-serif" font-size="16"
        font-weight="bold" fill="#1e3a5f" text-anchor="middle"
    >
        <text x="720" y="146">M+</text>
        <text x="795" y="146">M+</text>
        <text x="870" y="146">M+</text>

        <text x="720" y="226">M+</text>
        <text x="795" y="226">M+</text>
        <text x="870" y="226">M+</text>
    </g>

    <g fill="#991b1b">
        <circle cx="758" cy="100" r="6"/>
        <circle cx="833" cy="100" r="6"/>
        <circle cx="758" cy="180" r="6"/>
        <circle cx="833" cy="180" r="6"/>
        <circle cx="758" cy="260" r="6"/>
        <circle cx="833" cy="260" r="6"/>
    </g>

    <text
        x="795" y="305" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="17" fill="#1f2937"
    >
        Mobile, delocalized electrons
    </text>

    <text
        x="795" y="355" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="16"
        font-weight="bold" fill="#1e3a5f"
    >
        Electrons move through the metal
    </text>
</svg>
