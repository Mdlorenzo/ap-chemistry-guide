<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 800 560"
    role="img"
    aria-labelledby="title description"
>
    <title id="title">Chromatography separation</title>

    <desc id="description">
        A chromatography plate shows an original baseline, a solvent front,
        and two components that traveled different distances.
    </desc>

    <rect width="800" height="560" fill="#ffffff"/>

    <text
        x="400" y="38"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="25"
        font-weight="bold"
        fill="#1f2937"
    >
        Chromatography
    </text>

    <!-- Chromatography plate -->
    <rect
        x="190" y="80" width="420" height="400"
        fill="#f8fafc" stroke="#1e3a5f" stroke-width="3"
    />

    <!-- Solvent front -->
    <line
        x1="210" y1="135" x2="590" y2="135"
        stroke="#1e3a5f" stroke-width="3"
        stroke-dasharray="9 7"
    />

    <text
        x="625" y="141"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#1e3a5f"
    >
        Solvent front
    </text>

    <!-- Baseline -->
    <line
        x1="210" y1="430" x2="590" y2="430"
        stroke="#1f2937" stroke-width="3"
    />

    <text
        x="625" y="436"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#1f2937"
    >
        Baseline
    </text>

    <!-- Original sample -->
    <circle cx="400" cy="430" r="12" fill="#4b5563"/>

    <!-- Separated components -->
    <circle cx="350" cy="210" r="18" fill="#991b1b"/>

    <circle cx="450" cy="325" r="18" fill="#1e3a5f"/>

    <text
        x="315" y="214"
        text-anchor="end"
        font-family="Arial, sans-serif"
        font-size="18"
        font-weight="bold"
        fill="#991b1b"
    >
        A
    </text>

    <text
        x="415" y="329"
        text-anchor="end"
        font-family="Arial, sans-serif"
        font-size="18"
        font-weight="bold"
        fill="#1e3a5f"
    >
        B
    </text>

    <!-- Distance indicators -->
    <line
        x1="300" y1="430" x2="300" y2="210"
        stroke="#991b1b" stroke-width="2"
        stroke-dasharray="6 5"
    />

    <line
        x1="500" y1="430" x2="500" y2="325"
        stroke="#1e3a5f" stroke-width="2"
        stroke-dasharray="6 5"
    />

    <text
        x="400" y="520"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#4b5563"
    >
        Component A travels farther than Component B
    </text>
</svg>
