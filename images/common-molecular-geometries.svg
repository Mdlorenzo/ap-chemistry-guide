<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 1000 730"
    role="img"
    aria-labelledby="title description"
>
    <title id="title">Common molecular geometries</title>

    <desc id="description">
        Diagrams showing linear, trigonal planar, tetrahedral,
        trigonal pyramidal, and bent molecular geometries.
    </desc>

    <rect width="1000" height="730" fill="#ffffff"/>

    <text
        x="500" y="40"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="26"
        font-weight="bold"
        fill="#1f2937"
    >
        Common Molecular Geometries
    </text>

    <!-- Larger panel backgrounds -->
<g fill="#f8fafc" stroke="#cbd9e8" stroke-width="2">

    <rect
        x="20"
        y="70"
        width="310"
        height="300"
        rx="12"
    />

    <rect
        x="345"
        y="70"
        width="310"
        height="300"
        rx="12"
    />

    <rect
        x="670"
        y="70"
        width="310"
        height="300"
        rx="12"
    />

    <rect
        x="165"
        y="380"
        width="340"
        height="320"
        rx="12"
    />

    <rect
        x="495"
        y="380"
        width="340"
        height="320"
        rx="12"
    />

</g>

    <!-- Linear -->
    <text
        x="175" y="105"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="21"
        font-weight="bold"
        fill="#1e3a5f"
    >
        Linear
    </text>

    <line x1="95" y1="195" x2="150" y2="195"
          stroke="#1f2937" stroke-width="6"/>

    <line x1="200" y1="195" x2="255" y2="195"
          stroke="#1f2937" stroke-width="6"/>

    <circle cx="75" cy="195" r="24" fill="#94a3b8"/>
    <circle cx="175" cy="195" r="30" fill="#1e3a5f"/>
    <circle cx="275" cy="195" r="24" fill="#94a3b8"/>

    <text x="175" y="340" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="17" fill="#4b5563">
        180°
    </text>

    <!-- Trigonal planar -->
    <text
        x="500" y="105"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="21"
        font-weight="bold"
        fill="#1e3a5f"
    >
        Trigonal Planar
    </text>

    <line x1="500" y1="175" x2="500" y2="164"
      stroke="#1f2937" stroke-width="6"/>

    <line x1="475" y1="210" x2="420" y2="255"
          stroke="#1f2937" stroke-width="6"/>

    <line x1="525" y1="210" x2="580" y2="255"
          stroke="#1f2937" stroke-width="6"/>

    <circle cx="500" cy="205" r="30" fill="#1e3a5f"/>
    <circle cx="500" cy="140" r="24" fill="#94a3b8"/>
    <circle cx="400" cy="270" r="24" fill="#94a3b8"/>
    <circle cx="600" cy="270" r="24" fill="#94a3b8"/>

    <text x="500" y="340" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="17" fill="#4b5563">
        120°
    </text>

    <!-- Tetrahedral -->
    <text
        x="825" y="105"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="21"
        font-weight="bold"
        fill="#1e3a5f"
    >
        Tetrahedral
    </text>

    <line x1="825" y1="175" x2="825" y2="164"
      stroke="#1f2937" stroke-width="6"/>

    <line x1="800" y1="210" x2="745" y2="260"
          stroke="#1f2937" stroke-width="6"/>

    <line x1="850" y1="210" x2="905" y2="260"
          stroke="#1f2937" stroke-width="6"/>

    <polygon
        points="815,210 790,270 825,220"
        fill="#1f2937"
    />

    <circle cx="825" cy="205" r="30" fill="#1e3a5f"/>
    <circle cx="825" cy="140" r="24" fill="#94a3b8"/>
    <circle cx="725" cy="275" r="24" fill="#94a3b8"/>
    <circle cx="925" cy="275" r="24" fill="#94a3b8"/>
    <circle cx="780" cy="290" r="24" fill="#94a3b8"/>

    <text x="825" y="340" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="17" fill="#4b5563">
        109.5°
    </text>

    <!-- Trigonal pyramidal -->
    <text
        x="335" y="405"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="21"
        font-weight="bold"
        fill="#1e3a5f"
    >
        Trigonal Pyramidal
    </text>

    <line x1="310" y1="510" x2="250" y2="565"
          stroke="#1f2937" stroke-width="6"/>

    <line x1="360" y1="510" x2="420" y2="565"
          stroke="#1f2937" stroke-width="6"/>

    <line x1="335" y1="520" x2="335" y2="590"
          stroke="#1f2937" stroke-width="6"/>

    <circle cx="335" cy="505" r="30" fill="#1e3a5f"/>
    <circle cx="230" cy="580" r="24" fill="#94a3b8"/>
    <circle cx="440" cy="580" r="24" fill="#94a3b8"/>
    <circle cx="335" cy="610" r="24" fill="#94a3b8"/>

    <circle cx="323" cy="445" r="7" fill="#991b1b"/>
    <circle cx="347" cy="445" r="7" fill="#991b1b"/>

    <text x="335" y="675" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="17" fill="#4b5563">
        Approximately 107°
    </text>

    <!-- Bent -->
    <text
        x="665" y="405"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="21"
        font-weight="bold"
        fill="#1e3a5f"
    >
        Bent
    </text>

    <line x1="640" y1="515" x2="585" y2="575"
          stroke="#1f2937" stroke-width="6"/>

    <line x1="690" y1="515" x2="745" y2="575"
          stroke="#1f2937" stroke-width="6"/>

    <circle cx="665" cy="505" r="30" fill="#1e3a5f"/>
    <circle cx="565" cy="590" r="24" fill="#94a3b8"/>
    <circle cx="765" cy="590" r="24" fill="#94a3b8"/>

    <circle cx="635" cy="450" r="7" fill="#991b1b"/>
    <circle cx="653" cy="440" r="7" fill="#991b1b"/>
    <circle cx="677" cy="440" r="7" fill="#991b1b"/>
    <circle cx="695" cy="450" r="7" fill="#991b1b"/>

    <text x="665" y="675" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="17" fill="#4b5563">
        Approximately 104.5°
    </text>
</svg>
