<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 1100 520"
    role="img"
    aria-labelledby="title description"
>
    <title id="title">Electromagnetic spectrum</title>

    <desc id="description">
        The electromagnetic spectrum runs from radio waves with long
        wavelengths and low energies to gamma rays with short wavelengths
        and high energies.
    </desc>

    <defs>
        <linearGradient id="visible-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ef4444"/>
            <stop offset="20%" stop-color="#f97316"/>
            <stop offset="38%" stop-color="#eab308"/>
            <stop offset="55%" stop-color="#22c55e"/>
            <stop offset="72%" stop-color="#3b82f6"/>
            <stop offset="86%" stop-color="#4f46e5"/>
            <stop offset="100%" stop-color="#7e22ce"/>
        </linearGradient>

        <marker
            id="left-arrow"
            markerWidth="10"
            markerHeight="10"
            refX="2"
            refY="3"
            orient="auto"
        >
            <path d="M9,0 L9,6 L0,3 z" fill="#1e3a5f"/>
        </marker>

        <marker
            id="right-arrow"
            markerWidth="10"
            markerHeight="10"
            refX="8"
            refY="3"
            orient="auto"
        >
            <path d="M0,0 L0,6 L9,3 z" fill="#991b1b"/>
        </marker>
    </defs>

    <rect width="1100" height="520" fill="#ffffff"/>

    <text
        x="550" y="42"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="27"
        font-weight="bold"
        fill="#1f2937"
    >
        Electromagnetic Spectrum
    </text>

    <!-- Spectrum boxes -->
    <g stroke="#ffffff" stroke-width="2">
        <rect x="50" y="180" width="145" height="100" fill="#93c5fd"/>
        <rect x="195" y="180" width="145" height="100" fill="#67e8f9"/>
        <rect x="340" y="180" width="145" height="100" fill="#fca5a5"/>
        <rect x="485" y="180" width="145" height="100" fill="url(#visible-gradient)"/>
        <rect x="630" y="180" width="145" height="100" fill="#c084fc"/>
        <rect x="775" y="180" width="145" height="100" fill="#818cf8"/>
        <rect x="920" y="180" width="130" height="100" fill="#6366f1"/>
    </g>

    <!-- Region labels -->
    <g
        font-family="Arial, sans-serif"
        font-size="17"
        font-weight="bold"
        fill="#1f2937"
        text-anchor="middle"
    >
        <text x="122" y="235">Radio</text>
        <text x="267" y="235">Microwave</text>
        <text x="412" y="235">Infrared</text>
        <text x="557" y="235" fill="#ffffff">Visible</text>
        <text x="702" y="235">Ultraviolet</text>
        <text x="847" y="235">X-ray</text>
        <text x="985" y="235" fill="#ffffff">Gamma</text>
    </g>

    <!-- Wavelength arrow -->
    <line
        x1="1020" y1="115" x2="75" y2="115"
        stroke="#1e3a5f"
        stroke-width="4"
        marker-end="url(#left-arrow)"
    />

    <text
        x="550" y="95"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="18"
        font-weight="bold"
        fill="#1e3a5f"
    >
        Increasing wavelength
    </text>

    <!-- Frequency and energy arrow -->
    <line
        x1="75" y1="345" x2="1020" y2="345"
        stroke="#991b1b"
        stroke-width="4"
        marker-end="url(#right-arrow)"
    />

    <text
        x="550" y="380"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="18"
        font-weight="bold"
        fill="#991b1b"
    >
        Increasing frequency and photon energy
    </text>

    <text
        x="122" y="430"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#4b5563"
    >
        Long wavelength
    </text>

    <text
        x="122" y="455"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#4b5563"
    >
        Low frequency
    </text>

    <text
        x="985" y="430"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#4b5563"
    >
        Short wavelength
    </text>

    <text
        x="985" y="455"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#4b5563"
    >
        High frequency
    </text>
</svg>
