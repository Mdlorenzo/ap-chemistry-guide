<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 1200 470"
    role="img"
    aria-labelledby="title description"
>
    <title id="title">Integrated rate law linear plots</title>

    <desc id="description">
        Three panels showing concentration versus time for a zero-order
        reaction, natural logarithm of concentration versus time for a
        first-order reaction, and reciprocal concentration versus time
        for a second-order reaction.
    </desc>

    <rect width="1200" height="470" fill="#ffffff"/>

    <text
        x="600"
        y="38"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="27"
        font-weight="bold"
        fill="#1f2937"
    >
        Identifying Reaction Order with Linear Plots
    </text>


    <!-- Panel backgrounds -->

    <g fill="#f8fafc" stroke="#cbd9e8" stroke-width="2">

        <rect x="20" y="65" width="370" height="375" rx="12"/>
        <rect x="415" y="65" width="370" height="375" rx="12"/>
        <rect x="810" y="65" width="370" height="375" rx="12"/>

    </g>


    <!-- Zero-order panel -->

    <text
        x="205"
        y="102"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="22"
        font-weight="bold"
        fill="#1e3a5f"
    >
        Zero Order
    </text>

    <line
        x1="85" y1="350"
        x2="335" y2="350"
        stroke="#1f2937"
        stroke-width="3"
    />

    <line
        x1="85" y1="350"
        x2="85" y2="135"
        stroke="#1f2937"
        stroke-width="3"
    />

    <line
        x1="105" y1="160"
        x2="315" y2="325"
        stroke="#2563eb"
        stroke-width="6"
        stroke-linecap="round"
    />

    <circle cx="105" cy="160" r="5" fill="#2563eb"/>
    <circle cx="175" cy="215" r="5" fill="#2563eb"/>
    <circle cx="245" cy="270" r="5" fill="#2563eb"/>
    <circle cx="315" cy="325" r="5" fill="#2563eb"/>

    <text
        x="210"
        y="390"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="18"
        fill="#1f2937"
    >
        Time
    </text>

    <text
        x="49"
        y="245"
        text-anchor="middle"
        transform="rotate(-90 49 245)"
        font-family="Arial, sans-serif"
        font-size="18"
        fill="#1f2937"
    >
        [A]
    </text>

    <text
        x="205"
        y="420"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="17"
        font-weight="bold"
        fill="#4b5563"
    >
        Straight line: slope = −k
    </text>


    <!-- First-order panel -->

    <text
        x="600"
        y="102"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="22"
        font-weight="bold"
        fill="#1e3a5f"
    >
        First Order
    </text>

    <line
        x1="480" y1="350"
        x2="730" y2="350"
        stroke="#1f2937"
        stroke-width="3"
    />

    <line
        x1="480" y1="350"
        x2="480" y2="135"
        stroke="#1f2937"
        stroke-width="3"
    />

    <line
        x1="500" y1="160"
        x2="710" y2="325"
        stroke="#16a34a"
        stroke-width="6"
        stroke-linecap="round"
    />

    <circle cx="500" cy="160" r="5" fill="#16a34a"/>
    <circle cx="570" cy="215" r="5" fill="#16a34a"/>
    <circle cx="640" cy="270" r="5" fill="#16a34a"/>
    <circle cx="710" cy="325" r="5" fill="#16a34a"/>

    <text
        x="605"
        y="390"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="18"
        fill="#1f2937"
    >
        Time
    </text>

    <text
        x="444"
        y="245"
        text-anchor="middle"
        transform="rotate(-90 444 245)"
        font-family="Arial, sans-serif"
        font-size="18"
        fill="#1f2937"
    >
        ln[A]
    </text>

    <text
        x="600"
        y="420"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="17"
        font-weight="bold"
        fill="#4b5563"
    >
        Straight line: slope = −k
    </text>


    <!-- Second-order panel -->

    <text
        x="995"
        y="102"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="22"
        font-weight="bold"
        fill="#1e3a5f"
    >
        Second Order
    </text>

    <line
        x1="875" y1="350"
        x2="1125" y2="350"
        stroke="#1f2937"
        stroke-width="3"
    />

    <line
        x1="875" y1="350"
        x2="875" y2="135"
        stroke="#1f2937"
        stroke-width="3"
    />

    <line
        x1="895" y1="325"
        x2="1105" y2="160"
        stroke="#dc2626"
        stroke-width="6"
        stroke-linecap="round"
    />

    <circle cx="895" cy="325" r="5" fill="#dc2626"/>
    <circle cx="965" cy="270" r="5" fill="#dc2626"/>
    <circle cx="1035" cy="215" r="5" fill="#dc2626"/>
    <circle cx="1105" cy="160" r="5" fill="#dc2626"/>

    <text
        x="1000"
        y="390"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="18"
        fill="#1f2937"
    >
        Time
    </text>

    <text
        x="839"
        y="245"
        text-anchor="middle"
        transform="rotate(-90 839 245)"
        font-family="Arial, sans-serif"
        font-size="18"
        fill="#1f2937"
    >
        1/[A]
    </text>

    <text
        x="995"
        y="420"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="17"
        font-weight="bold"
        fill="#4b5563"
    >
        Straight line: slope = +k
    </text>

</svg>
