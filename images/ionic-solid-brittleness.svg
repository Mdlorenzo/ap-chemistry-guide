<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 1000 520"
    role="img"
    aria-labelledby="title description"
>
    <title id="title">Brittleness of an ionic solid</title>

    <desc id="description">
        An undisturbed ionic lattice contains alternating positive and
        negative ions. After layers shift, ions with the same charge
        align and repel.
    </desc>

    <defs>
        <marker
            id="repulsion-arrow"
            markerWidth="10"
            markerHeight="10"
            refX="8"
            refY="3"
            orient="auto"
        >
            <path d="M0,0 L0,6 L9,3 z" fill="#991b1b"/>
        </marker>
    </defs>

    <rect width="1000" height="520" fill="#ffffff"/>

    <text
        x="500" y="38"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="26"
        font-weight="bold"
        fill="#1f2937"
    >
        Brittleness of an Ionic Solid
    </text>

    <!-- Panels -->
    <rect
        x="30" y="65" width="440" height="410" rx="12"
        fill="#f8fafc" stroke="#cbd9e8" stroke-width="2"
    />

    <rect
        x="530" y="65" width="440" height="410" rx="12"
        fill="#f8fafc" stroke="#cbd9e8" stroke-width="2"
    />

    <!-- Titles -->
    <text
        x="250" y="105"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="21"
        font-weight="bold"
        fill="#1e3a5f"
    >
        Undisturbed Lattice
    </text>

    <text
        x="750" y="105"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="21"
        font-weight="bold"
        fill="#1e3a5f"
    >
        Shifted Lattice
    </text>

    <!-- Undisturbed lattice -->
    <g
        font-family="Arial, sans-serif"
        font-size="18"
        font-weight="bold"
        text-anchor="middle"
    >
        <!-- Row 1 -->
        <circle cx="130" cy="165" r="31" fill="#dbeafe"
                stroke="#1e3a5f" stroke-width="2"/>
        <text x="130" y="172" fill="#1e3a5f">+</text>

        <circle cx="210" cy="165" r="31" fill="#fee2e2"
                stroke="#991b1b" stroke-width="2"/>
        <text x="210" y="172" fill="#991b1b">−</text>

        <circle cx="290" cy="165" r="31" fill="#dbeafe"
                stroke="#1e3a5f" stroke-width="2"/>
        <text x="290" y="172" fill="#1e3a5f">+</text>

        <circle cx="370" cy="165" r="31" fill="#fee2e2"
                stroke="#991b1b" stroke-width="2"/>
        <text x="370" y="172" fill="#991b1b">−</text>

        <!-- Row 2 -->
        <circle cx="130" cy="235" r="31" fill="#fee2e2"
                stroke="#991b1b" stroke-width="2"/>
        <text x="130" y="242" fill="#991b1b">−</text>

        <circle cx="210" cy="235" r="31" fill="#dbeafe"
                stroke="#1e3a5f" stroke-width="2"/>
        <text x="210" y="242" fill="#1e3a5f">+</text>

        <circle cx="290" cy="235" r="31" fill="#fee2e2"
                stroke="#991b1b" stroke-width="2"/>
        <text x="290" y="242" fill="#991b1b">−</text>

        <circle cx="370" cy="235" r="31" fill="#dbeafe"
                stroke="#1e3a5f" stroke-width="2"/>
        <text x="370" y="242" fill="#1e3a5f">+</text>

        <!-- Row 3 -->
        <circle cx="130" cy="305" r="31" fill="#dbeafe"
                stroke="#1e3a5f" stroke-width="2"/>
        <text x="130" y="312" fill="#1e3a5f">+</text>

        <circle cx="210" cy="305" r="31" fill="#fee2e2"
                stroke="#991b1b" stroke-width="2"/>
        <text x="210" y="312" fill="#991b1b">−</text>

        <circle cx="290" cy="305" r="31" fill="#dbeafe"
                stroke="#1e3a5f" stroke-width="2"/>
        <text x="290" y="312" fill="#1e3a5f">+</text>

        <circle cx="370" cy="305" r="31" fill="#fee2e2"
                stroke="#991b1b" stroke-width="2"/>
        <text x="370" y="312" fill="#991b1b">−</text>

        <!-- Row 4 -->
        <circle cx="130" cy="375" r="31" fill="#fee2e2"
                stroke="#991b1b" stroke-width="2"/>
        <text x="130" y="382" fill="#991b1b">−</text>

        <circle cx="210" cy="375" r="31" fill="#dbeafe"
                stroke="#1e3a5f" stroke-width="2"/>
        <text x="210" y="382" fill="#1e3a5f">+</text>

        <circle cx="290" cy="375" r="31" fill="#fee2e2"
                stroke="#991b1b" stroke-width="2"/>
        <text x="290" y="382" fill="#991b1b">−</text>

        <circle cx="370" cy="375" r="31" fill="#dbeafe"
                stroke="#1e3a5f" stroke-width="2"/>
        <text x="370" y="382" fill="#1e3a5f">+</text>
    </g>

    <text
        x="250" y="445"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#4b5563"
    >
        Opposite charges alternate
    </text>

    <!-- Shifted lattice -->
    <g
        font-family="Arial, sans-serif"
        font-size="18"
        font-weight="bold"
        text-anchor="middle"
    >
        <!-- Shifted upper rows -->
        <circle cx="670" cy="165" r="31" fill="#dbeafe"
                stroke="#1e3a5f" stroke-width="2"/>
        <text x="670" y="172" fill="#1e3a5f">+</text>

        <circle cx="750" cy="165" r="31" fill="#fee2e2"
                stroke="#991b1b" stroke-width="2"/>
        <text x="750" y="172" fill="#991b1b">−</text>

        <circle cx="830" cy="165" r="31" fill="#dbeafe"
                stroke="#1e3a5f" stroke-width="2"/>
        <text x="830" y="172" fill="#1e3a5f">+</text>

        <circle cx="910" cy="165" r="31" fill="#fee2e2"
                stroke="#991b1b" stroke-width="2"/>
        <text x="910" y="172" fill="#991b1b">−</text>

        <circle cx="670" cy="235" r="31" fill="#fee2e2"
                stroke="#991b1b" stroke-width="2"/>
        <text x="670" y="242" fill="#991b1b">−</text>

        <circle cx="750" cy="235" r="31" fill="#dbeafe"
                stroke="#1e3a5f" stroke-width="2"/>
        <text x="750" y="242" fill="#1e3a5f">+</text>

        <circle cx="830" cy="235" r="31" fill="#fee2e2"
                stroke="#991b1b" stroke-width="2"/>
        <text x="830" y="242" fill="#991b1b">−</text>

        <circle cx="910" cy="235" r="31" fill="#dbeafe"
                stroke="#1e3a5f" stroke-width="2"/>
        <text x="910" y="242" fill="#1e3a5f">+</text>

        <!-- Lower rows shifted to align like charges -->
        <circle cx="670" cy="315" r="31" fill="#fee2e2"
                stroke="#991b1b" stroke-width="2"/>
        <text x="670" y="322" fill="#991b1b">−</text>

        <circle cx="750" cy="315" r="31" fill="#dbeafe"
                stroke="#1e3a5f" stroke-width="2"/>
        <text x="750" y="322" fill="#1e3a5f">+</text>

        <circle cx="830" cy="315" r="31" fill="#fee2e2"
                stroke="#991b1b" stroke-width="2"/>
        <text x="830" y="322" fill="#991b1b">−</text>

        <circle cx="910" cy="315" r="31" fill="#dbeafe"
                stroke="#1e3a5f" stroke-width="2"/>
        <text x="910" y="322" fill="#1e3a5f">+</text>

        <circle cx="670" cy="385" r="31" fill="#dbeafe"
                stroke="#1e3a5f" stroke-width="2"/>
        <text x="670" y="392" fill="#1e3a5f">+</text>

        <circle cx="750" cy="385" r="31" fill="#fee2e2"
                stroke="#991b1b" stroke-width="2"/>
        <text x="750" y="392" fill="#991b1b">−</text>

        <circle cx="830" cy="385" r="31" fill="#dbeafe"
                stroke="#1e3a5f" stroke-width="2"/>
        <text x="830" y="392" fill="#1e3a5f">+</text>

        <circle cx="910" cy="385" r="31" fill="#fee2e2"
                stroke="#991b1b" stroke-width="2"/>
        <text x="910" y="392" fill="#991b1b">−</text>
    </g>

    <!-- Repulsion arrows -->
    <line
        x1="710" y1="275" x2="675" y2="275"
        stroke="#991b1b" stroke-width="4"
        marker-end="url(#repulsion-arrow)"
    />

    <line
        x1="790" y1="275" x2="825" y2="275"
        stroke="#991b1b" stroke-width="4"
        marker-end="url(#repulsion-arrow)"
    />

    <text
        x="750" y="455"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="17"
        font-weight="bold"
        fill="#991b1b"
    >
        Like charges align and repel
    </text>
</svg>
