<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 800 320"
    role="img"
    aria-labelledby="title description"
>
    <title id="title">
        Lewis structure of carbon dioxide
    </title>

    <desc id="description">
        A carbon atom is double bonded to two oxygen atoms. Each oxygen
        atom has two lone pairs.
    </desc>

    <rect width="800" height="320" fill="#ffffff"/>

    <text
        x="400"
        y="42"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="24"
        font-weight="bold"
        fill="#1f2937"
    >
        Lewis Structure of CO₂
    </text>

    <!-- Atom labels -->
    <g
        font-family="Arial, sans-serif"
        font-size="52"
        font-weight="bold"
        fill="#1e3a5f"
        text-anchor="middle"
    >
        <text x="160" y="190">O</text>
        <text x="400" y="190">C</text>
        <text x="640" y="190">O</text>
    </g>

    <!-- Double bond between left oxygen and carbon -->
    <line
        x1="205" y1="158" x2="350" y2="158"
        stroke="#1f2937" stroke-width="5"
    />

    <line
        x1="205" y1="178" x2="350" y2="178"
        stroke="#1f2937" stroke-width="5"
    />

    <!-- Double bond between carbon and right oxygen -->
    <line
        x1="450" y1="158" x2="595" y2="158"
        stroke="#1f2937" stroke-width="5"
    />

    <line
        x1="450" y1="178" x2="595" y2="178"
        stroke="#1f2937" stroke-width="5"
    />

    <!-- Lone pairs on left oxygen -->
    <g fill="#991b1b">
        <circle cx="148" cy="105" r="7"/>
        <circle cx="172" cy="105" r="7"/>

        <circle cx="148" cy="238" r="7"/>
        <circle cx="172" cy="238" r="7"/>
    </g>

    <!-- Lone pairs on right oxygen -->
    <g fill="#991b1b">
        <circle cx="628" cy="105" r="7"/>
        <circle cx="652" cy="105" r="7"/>

        <circle cx="628" cy="238" r="7"/>
        <circle cx="652" cy="238" r="7"/>
    </g>

    <text
        x="400"
        y="290"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#4b5563"
    >
        16 total valence electrons
    </text>
</svg>
