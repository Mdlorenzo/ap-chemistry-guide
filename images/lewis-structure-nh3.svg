<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 800 400"
    role="img"
    aria-labelledby="title description"
>
    <title id="title">
        Lewis structure of ammonia
    </title>

    <desc id="description">
        A central nitrogen atom forms three single bonds to hydrogen
        atoms and has one lone pair.
    </desc>

    <rect width="800" height="400" fill="#ffffff"/>

    <text
        x="400"
        y="42"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="24"
        font-weight="bold"
        fill="#1f2937"
    >
        Lewis Structure of NH₃
    </text>

    <!-- Bonds -->
    <line
        x1="350" y1="180" x2="285" y2="180"
        stroke="#1f2937" stroke-width="5"
    />

    <line
        x1="450" y1="180" x2="515" y2="180"
        stroke="#1f2937" stroke-width="5"
    />

    <line
        x1="400" y1="215" x2="400" y2="280"
        stroke="#1f2937" stroke-width="5"
    />

    <!-- Atom labels -->
    <g
        font-family="Arial, sans-serif"
        font-size="52"
        font-weight="bold"
        fill="#1e3a5f"
        text-anchor="middle"
    >
        <text x="400" y="198">N</text>
        <text x="250" y="198">H</text>
        <text x="550" y="198">H</text>
        <text x="400" y="335">H</text>
    </g>

    <!-- Lone pair on nitrogen -->
    <circle cx="388" cy="105" r="7" fill="#991b1b"/>
    <circle cx="412" cy="105" r="7" fill="#991b1b"/>

    <text
        x="400"
        y="375"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#4b5563"
    >
        8 total valence electrons
    </text>
</svg>
