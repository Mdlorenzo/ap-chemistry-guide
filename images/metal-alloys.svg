<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 1100 540"
    role="img"
    aria-labelledby="title description"
>
    <title id="title">Pure metal and alloy structures</title>

    <desc id="description">
        Three particle diagrams compare a pure metal, an interstitial alloy
        containing much smaller atoms, and a substitutional alloy containing
        similarly sized atoms.
    </desc>

    <rect width="1100" height="540" fill="#ffffff"/>

    <text
        x="550" y="38"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="26"
        font-weight="bold"
        fill="#1f2937"
    >
        Pure Metals and Alloys
    </text>

    <!-- Panel backgrounds -->
    <g fill="#f8fafc" stroke="#cbd9e8" stroke-width="2">
        <rect x="20" y="65" width="340" height="430" rx="12"/>
        <rect x="380" y="65" width="340" height="430" rx="12"/>
        <rect x="740" y="65" width="340" height="430" rx="12"/>
    </g>

    <!-- Panel titles -->
    <g
        font-family="Arial, sans-serif"
        font-size="21"
        font-weight="bold"
        fill="#1e3a5f"
        text-anchor="middle"
    >
        <text x="190" y="105">Pure Metal</text>
        <text x="550" y="105">Interstitial Alloy</text>
        <text x="910" y="105">Substitutional Alloy</text>
    </g>

    <!-- Pure metal lattice -->
    <g fill="#93c5fd" stroke="#1e3a5f" stroke-width="2">
        <circle cx="100" cy="165" r="30"/>
        <circle cx="160" cy="165" r="30"/>
        <circle cx="220" cy="165" r="30"/>
        <circle cx="280" cy="165" r="30"/>

        <circle cx="100" cy="225" r="30"/>
        <circle cx="160" cy="225" r="30"/>
        <circle cx="220" cy="225" r="30"/>
        <circle cx="280" cy="225" r="30"/>

        <circle cx="100" cy="285" r="30"/>
        <circle cx="160" cy="285" r="30"/>
        <circle cx="220" cy="285" r="30"/>
        <circle cx="280" cy="285" r="30"/>

        <circle cx="100" cy="345" r="30"/>
        <circle cx="160" cy="345" r="30"/>
        <circle cx="220" cy="345" r="30"/>
        <circle cx="280" cy="345" r="30"/>
    </g>

    <text
        x="190" y="420"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#4b5563"
    >
        Identical atoms in regular layers
    </text>

    <!-- Interstitial alloy host lattice -->
    <g fill="#93c5fd" stroke="#1e3a5f" stroke-width="2">
        <circle cx="460" cy="165" r="30"/>
        <circle cx="520" cy="165" r="30"/>
        <circle cx="580" cy="165" r="30"/>
        <circle cx="640" cy="165" r="30"/>

        <circle cx="460" cy="225" r="30"/>
        <circle cx="520" cy="225" r="30"/>
        <circle cx="580" cy="225" r="30"/>
        <circle cx="640" cy="225" r="30"/>

        <circle cx="460" cy="285" r="30"/>
        <circle cx="520" cy="285" r="30"/>
        <circle cx="580" cy="285" r="30"/>
        <circle cx="640" cy="285" r="30"/>

        <circle cx="460" cy="345" r="30"/>
        <circle cx="520" cy="345" r="30"/>
        <circle cx="580" cy="345" r="30"/>
        <circle cx="640" cy="345" r="30"/>
    </g>

    <!-- Smaller interstitial atoms -->
    <g fill="#fca5a5" stroke="#991b1b" stroke-width="2">
        <circle cx="490" cy="195" r="11"/>
        <circle cx="610" cy="195" r="11"/>
        <circle cx="550" cy="255" r="11"/>
        <circle cx="490" cy="315" r="11"/>
        <circle cx="610" cy="315" r="11"/>
    </g>

    <text
        x="550" y="410"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#4b5563"
    >
        Smaller atoms occupy gaps
    </text>

    <text
        x="550" y="440"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="16"
        font-weight="bold"
        fill="#991b1b"
    >
        Much smaller atomic radius
    </text>

    <!-- Substitutional alloy lattice -->
    <g stroke-width="2">
        <circle cx="820" cy="165" r="30"
                fill="#93c5fd" stroke="#1e3a5f"/>
        <circle cx="880" cy="165" r="30"
                fill="#fbbf24" stroke="#92400e"/>
        <circle cx="940" cy="165" r="30"
                fill="#93c5fd" stroke="#1e3a5f"/>
        <circle cx="1000" cy="165" r="30"
                fill="#93c5fd" stroke="#1e3a5f"/>

        <circle cx="820" cy="225" r="30"
                fill="#93c5fd" stroke="#1e3a5f"/>
        <circle cx="880" cy="225" r="30"
                fill="#93c5fd" stroke="#1e3a5f"/>
        <circle cx="940" cy="225" r="30"
                fill="#93c5fd" stroke="#1e3a5f"/>
        <circle cx="1000" cy="225" r="30"
                fill="#fbbf24" stroke="#92400e"/>

        <circle cx="820" cy="285" r="30"
                fill="#fbbf24" stroke="#92400e"/>
        <circle cx="880" cy="285" r="30"
                fill="#93c5fd" stroke="#1e3a5f"/>
        <circle cx="940" cy="285" r="30"
                fill="#93c5fd" stroke="#1e3a5f"/>
        <circle cx="1000" cy="285" r="30"
                fill="#93c5fd" stroke="#1e3a5f"/>

        <circle cx="820" cy="345" r="30"
                fill="#93c5fd" stroke="#1e3a5f"/>
        <circle cx="880" cy="345" r="30"
                fill="#93c5fd" stroke="#1e3a5f"/>
        <circle cx="940" cy="345" r="30"
                fill="#fbbf24" stroke="#92400e"/>
        <circle cx="1000" cy="345" r="30"
                fill="#93c5fd" stroke="#1e3a5f"/>
    </g>

    <text
        x="910" y="410"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#4b5563"
    >
        Similar-sized atoms replace host atoms
    </text>

    <text
        x="910" y="440"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="16"
        font-weight="bold"
        fill="#92400e"
    >
        Similar atomic radius
    </text>

    <!-- Legend -->
    <circle cx="370" cy="510" r="11"
            fill="#93c5fd" stroke="#1e3a5f" stroke-width="2"/>

    <text
        x="390" y="516"
        font-family="Arial, sans-serif"
        font-size="15"
        fill="#1f2937"
    >
        Host-metal atom
    </text>

    <circle cx="535" cy="510" r="8"
            fill="#fca5a5" stroke="#991b1b" stroke-width="2"/>

    <text
        x="552" y="516"
        font-family="Arial, sans-serif"
        font-size="15"
        fill="#1f2937"
    >
        Smaller atom
    </text>

    <circle cx="680" cy="510" r="11"
            fill="#fbbf24" stroke="#92400e" stroke-width="2"/>

    <text
        x="700" y="516"
        font-family="Arial, sans-serif"
        font-size="15"
        fill="#1f2937"
    >
        Similar-sized atom
    </text>
</svg>
