<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 1000 480"
    role="img"
    aria-labelledby="title description"
>
    <title id="title">Molecular polarity comparison</title>

    <desc id="description">
        Carbon dioxide has two opposite bond dipoles that cancel.
        Water has two angled bond dipoles that do not cancel.
    </desc>

    <defs>
        <marker
            id="dipole-arrow"
            markerWidth="10"
            markerHeight="10"
            refX="8"
            refY="3"
            orient="auto"
        >
            <path d="M0,0 L0,6 L9,3 z" fill="#991b1b"/>
        </marker>
    </defs>

    <rect width="1000" height="480" fill="#ffffff"/>

    <text
        x="500" y="40"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="26"
        font-weight="bold"
        fill="#1f2937"
    >
        Molecular Polarity
    </text>

    <!-- Panels -->
    <rect
        x="30" y="70" width="450" height="370" rx="12"
        fill="#f8fafc" stroke="#cbd9e8" stroke-width="2"
    />

    <rect
        x="520" y="70" width="450" height="370" rx="12"
        fill="#f8fafc" stroke="#cbd9e8" stroke-width="2"
    />

    <!-- CO2 title -->
    <text
        x="255" y="110"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="22"
        font-weight="bold"
        fill="#1e3a5f"
    >
        CO₂: Nonpolar
    </text>

    <!-- CO2 bonds -->
    <line x1="145" y1="225" x2="225" y2="225"
          stroke="#1f2937" stroke-width="6"/>

    <line x1="285" y1="225" x2="365" y2="225"
          stroke="#1f2937" stroke-width="6"/>

    <!-- CO2 atoms -->
    <g
        font-family="Arial, sans-serif"
        font-size="45"
        font-weight="bold"
        text-anchor="middle"
    >
        <text x="115" y="240" fill="#991b1b">O</text>
        <text x="255" y="240" fill="#1e3a5f">C</text>
        <text x="395" y="240" fill="#991b1b">O</text>
    </g>

    <!-- CO2 dipole arrows -->
    <line
        x1="225" y1="165" x2="135" y2="165"
        stroke="#991b1b" stroke-width="4"
        marker-end="url(#dipole-arrow)"
    />

    <line
        x1="285" y1="165" x2="375" y2="165"
        stroke="#991b1b" stroke-width="4"
        marker-end="url(#dipole-arrow)"
    />

    <text
        x="255" y="320"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#4b5563"
    >
        Equal and opposite dipoles cancel
    </text>

    <text
        x="255" y="365"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="19"
        font-weight="bold"
        fill="#1e3a5f"
    >
        Net dipole = 0
    </text>

    <!-- H2O title -->
    <text
        x="745" y="110"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="22"
        font-weight="bold"
        fill="#1e3a5f"
    >
        H₂O: Polar
    </text>

    <!-- H2O bonds -->
    <line x1="720" y1="220" x2="650" y2="295"
          stroke="#1f2937" stroke-width="6"/>

    <line x1="770" y1="220" x2="840" y2="295"
          stroke="#1f2937" stroke-width="6"/>

    <!-- H2O atoms -->
    <g
        font-family="Arial, sans-serif"
        font-size="45"
        font-weight="bold"
        text-anchor="middle"
    >
        <text x="745" y="220" fill="#991b1b">O</text>
        <text x="625" y="335" fill="#1e3a5f">H</text>
        <text x="865" y="335" fill="#1e3a5f">H</text>
    </g>

    <!-- H2O bond dipoles -->
    <line
        x1="660" y1="275" x2="710" y2="225"
        stroke="#991b1b" stroke-width="4"
        marker-end="url(#dipole-arrow)"
    />

    <line
        x1="830" y1="275" x2="780" y2="225"
        stroke="#991b1b" stroke-width="4"
        marker-end="url(#dipole-arrow)"
    />

    <!-- Net dipole -->
    <line
        x1="745" y1="275" x2="745" y2="145"
        stroke="#1e3a5f" stroke-width="5"
        marker-end="url(#dipole-arrow)"
    />

    <text
        x="745" y="385"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#4b5563"
    >
        Angled dipoles do not cancel
    </text>

    <text
        x="745" y="420"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="19"
        font-weight="bold"
        fill="#1e3a5f"
    >
        Net dipole ≠ 0
    </text>
</svg>
