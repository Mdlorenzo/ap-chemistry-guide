<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 900 570"
    role="img"
    aria-labelledby="title description"
>
    <title id="title">Two-step reaction-energy profile</title>

    <desc id="description">
        An exothermic two-step energy profile with two transition
        states, one intermediate, and a larger activation-energy
        barrier for the first step.
    </desc>

    <rect width="900" height="570" fill="#ffffff"/>

    <text
        x="450"
        y="38"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="27"
        font-weight="bold"
        fill="#1f2937"
    >
        Energy Profile for a Two-Step Mechanism
    </text>

    <rect
        x="35"
        y="65"
        width="830"
        height="465"
        rx="14"
        fill="#f8fafc"
        stroke="#cbd9e8"
        stroke-width="2"
    />

    <!-- Axes -->

    <line
        x1="105"
        y1="460"
        x2="810"
        y2="460"
        stroke="#1f2937"
        stroke-width="3"
    />

    <line
        x1="105"
        y1="460"
        x2="105"
        y2="100"
        stroke="#1f2937"
        stroke-width="3"
    />

    <text
        x="455"
        y="505"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="19"
        fill="#1f2937"
    >
        Reaction Progress
    </text>

    <text
        x="62"
        y="280"
        text-anchor="middle"
        transform="rotate(-90 62 280)"
        font-family="Arial, sans-serif"
        font-size="19"
        fill="#1f2937"
    >
        Potential Energy
    </text>

    <!-- Energy pathway -->

    <path
        d="M 145 350
           L 205 350
           C 260 345, 285 150, 350 135
           C 415 150, 420 300, 475 315
           C 530 300, 550 210, 615 195
           C 680 210, 700 390, 760 395
           L 790 395"
        fill="none"
        stroke="#2563eb"
        stroke-width="7"
        stroke-linecap="round"
    />

    <!-- Important points -->

    <circle cx="350" cy="135" r="8" fill="#dc2626"/>
    <circle cx="475" cy="315" r="8" fill="#7c3aed"/>
    <circle cx="615" cy="195" r="8" fill="#dc2626"/>

    <!-- Labels -->

    <text
        x="175"
        y="380"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="18"
        font-weight="bold"
        fill="#1f2937"
    >
        Reactants
    </text>

    <text
        x="760"
        y="425"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="18"
        font-weight="bold"
        fill="#1f2937"
    >
        Products
    </text>

    <text
        x="350"
        y="110"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="17"
        font-weight="bold"
        fill="#dc2626"
    >
        Transition State 1
    </text>

    <text
        x="615"
        y="170"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="17"
        font-weight="bold"
        fill="#dc2626"
    >
        Transition State 2
    </text>

    <text
        x="475"
        y="350"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="17"
        font-weight="bold"
        fill="#7c3aed"
    >
        Intermediate
    </text>

    <!-- Step labels -->

    <text
        x="315"
        y="430"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="18"
        font-weight="bold"
        fill="#1e3a5f"
    >
        Step 1
    </text>

    <text
        x="635"
        y="430"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="18"
        font-weight="bold"
        fill="#1e3a5f"
    >
        Step 2
    </text>

    <!-- Activation-energy comparisons -->

    <line
        x1="250"
        y1="350"
        x2="250"
        y2="135"
        stroke="#64748b"
        stroke-width="3"
        stroke-dasharray="8 7"
    />

    <text
        x="235"
        y="245"
        text-anchor="end"
        font-family="Arial, sans-serif"
        font-size="17"
        font-weight="bold"
        fill="#4b5563"
    >
        Larger Eₐ
    </text>

    <line
        x1="545"
        y1="315"
        x2="545"
        y2="195"
        stroke="#64748b"
        stroke-width="3"
        stroke-dasharray="8 7"
    />

    <text
        x="560"
        y="260"
        text-anchor="start"
        font-family="Arial, sans-serif"
        font-size="17"
        font-weight="bold"
        fill="#4b5563"
    >
        Smaller Eₐ
    </text>

</svg>
