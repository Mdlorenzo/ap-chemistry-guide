<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 1000 560"
    role="img"
    aria-labelledby="title description"
>
    <title id="title">Precipitation reaction particle diagram</title>

    <desc id="description">
        Before the reaction, silver, nitrate, sodium, and chloride ions
        move separately in solution. After the reaction, silver and
        chloride form a solid precipitate while sodium and nitrate remain
        dissolved.
    </desc>

    <defs>
        <marker
            id="reaction-arrow"
            markerWidth="12"
            markerHeight="12"
            refX="10"
            refY="4"
            orient="auto"
        >
            <path d="M0,0 L0,8 L11,4 z" fill="#1f2937"/>
        </marker>
    </defs>

    <rect width="1000" height="560" fill="#ffffff"/>

    <text
        x="500" y="40"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="25"
        font-weight="bold"
        fill="#1f2937"
    >
        Formation of an AgCl Precipitate
    </text>

    <!-- Solution containers -->
    <rect
        x="35" y="90" width="380" height="370" rx="10"
        fill="#dbeafe" fill-opacity="0.45"
        stroke="#1e3a5f" stroke-width="3"
    />

    <rect
        x="585" y="90" width="380" height="370" rx="10"
        fill="#dbeafe" fill-opacity="0.45"
        stroke="#1e3a5f" stroke-width="3"
    />

    <!-- Titles -->
    <text
        x="225" y="125"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="21"
        font-weight="bold"
        fill="#1e3a5f"
    >
        Before Reaction
    </text>

    <text
        x="775" y="125"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="21"
        font-weight="bold"
        fill="#1e3a5f"
    >
        After Reaction
    </text>

    <!-- Before-reaction ions -->
    <g
        font-family="Arial, sans-serif"
        font-size="17"
        font-weight="bold"
        text-anchor="middle"
    >
        <circle cx="110" cy="190" r="32"
                fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
        <text x="110" y="196" fill="#1f2937">Ag+</text>

        <circle cx="300" cy="175" r="38"
                fill="#fde68a" stroke="#92400e" stroke-width="2"/>
        <text x="300" y="181" fill="#92400e">NO₃−</text>

        <circle cx="170" cy="295" r="32"
                fill="#bfdbfe" stroke="#1e3a5f" stroke-width="2"/>
        <text x="170" y="301" fill="#1e3a5f">Na+</text>

        <circle cx="340" cy="315" r="32"
                fill="#fecaca" stroke="#991b1b" stroke-width="2"/>
        <text x="340" y="321" fill="#991b1b">Cl−</text>

        <circle cx="85" cy="390" r="32"
                fill="#fecaca" stroke="#991b1b" stroke-width="2"/>
        <text x="85" y="396" fill="#991b1b">Cl−</text>

        <circle cx="270" cy="400" r="32"
                fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
        <text x="270" y="406" fill="#1f2937">Ag+</text>

        <circle cx="385" cy="230" r="32"
                fill="#bfdbfe" stroke="#1e3a5f" stroke-width="2"/>
        <text x="385" y="236" fill="#1e3a5f">Na+</text>

        <circle cx="210" cy="205" r="38"
                fill="#fde68a" stroke="#92400e" stroke-width="2"/>
        <text x="210" y="211" fill="#92400e">NO₃−</text>
    </g>

    <!-- Reaction arrow -->
    <line
        x1="455" y1="275" x2="545" y2="275"
        stroke="#1f2937"
        stroke-width="6"
        marker-end="url(#reaction-arrow)"
    />

    <!-- Spectator ions after reaction -->
    <g
        font-family="Arial, sans-serif"
        font-size="17"
        font-weight="bold"
        text-anchor="middle"
    >
        <circle cx="650" cy="180" r="32"
                fill="#bfdbfe" stroke="#1e3a5f" stroke-width="2"/>
        <text x="650" y="186" fill="#1e3a5f">Na+</text>

        <circle cx="875" cy="190" r="38"
                fill="#fde68a" stroke="#92400e" stroke-width="2"/>
        <text x="875" y="196" fill="#92400e">NO₃−</text>

        <circle cx="730" cy="280" r="38"
                fill="#fde68a" stroke="#92400e" stroke-width="2"/>
        <text x="730" y="286" fill="#92400e">NO₃−</text>

        <circle cx="915" cy="300" r="32"
                fill="#bfdbfe" stroke="#1e3a5f" stroke-width="2"/>
        <text x="915" y="306" fill="#1e3a5f">Na+</text>
    </g>

    <!-- AgCl precipitate -->
    <g
        font-family="Arial, sans-serif"
        font-size="16"
        font-weight="bold"
        text-anchor="middle"
    >
        <circle cx="700" cy="400" r="31"
                fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
        <text x="700" y="406" fill="#1f2937">Ag+</text>

        <circle cx="765" cy="400" r="31"
                fill="#fecaca" stroke="#991b1b" stroke-width="2"/>
        <text x="765" y="406" fill="#991b1b">Cl−</text>

        <circle cx="830" cy="400" r="31"
                fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
        <text x="830" y="406" fill="#1f2937">Ag+</text>

        <circle cx="895" cy="400" r="31"
                fill="#fecaca" stroke="#991b1b" stroke-width="2"/>
        <text x="895" y="406" fill="#991b1b">Cl−</text>
    </g>

    <text
        x="800" y="445"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="17"
        font-weight="bold"
        fill="#991b1b"
    >
        Solid AgCl precipitate
    </text>

    <text
        x="500" y="525"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="20"
        font-weight="bold"
        fill="#1e3a5f"
    >
        Ag⁺(aq) + Cl⁻(aq) → AgCl(s)
    </text>
</svg>
