<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 1000 480"
    role="img"
    aria-labelledby="title description"
>
    <title id="title">Particle representation of water formation</title>

    <desc id="description">
        Two hydrogen molecules and one oxygen molecule react to produce
        two water molecules while conserving every atom.
    </desc>

    <defs>
        <marker
            id="reaction-arrow"
            markerWidth="12"
            markerHeight="12"
            refX="10"
            refY="4"
            orient="auto"
        >
            <path d="M0,0 L0,8 L11,4 z" fill="#1f2937"/>
        </marker>
    </defs>

    <rect width="1000" height="480" fill="#ffffff"/>

    <text
        x="500" y="40"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="26"
        font-weight="bold"
        fill="#1f2937"
    >
        Particle Representation of Water Formation
    </text>

    <!-- Panel backgrounds -->
    <rect
        x="30" y="75" width="390" height="330" rx="12"
        fill="#f8fafc" stroke="#cbd9e8" stroke-width="2"
    />

    <rect
        x="580" y="75" width="390" height="330" rx="12"
        fill="#f8fafc" stroke="#cbd9e8" stroke-width="2"
    />

    <text
        x="225" y="115"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="22"
        font-weight="bold"
        fill="#1e3a5f"
    >
        Reactants
    </text>

    <text
        x="775" y="115"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="22"
        font-weight="bold"
        fill="#1e3a5f"
    >
        Products
    </text>

    <!-- Hydrogen molecule 1 -->
    <line x1="95" y1="190" x2="150" y2="190"
          stroke="#1f2937" stroke-width="5"/>

    <circle cx="75" cy="190" r="24"
            fill="#dbeafe" stroke="#1e3a5f" stroke-width="2"/>

    <circle cx="170" cy="190" r="24"
            fill="#dbeafe" stroke="#1e3a5f" stroke-width="2"/>

    <!-- Hydrogen molecule 2 -->
    <line x1="95" y1="300" x2="150" y2="300"
          stroke="#1f2937" stroke-width="5"/>

    <circle cx="75" cy="300" r="24"
            fill="#dbeafe" stroke="#1e3a5f" stroke-width="2"/>

    <circle cx="170" cy="300" r="24"
            fill="#dbeafe" stroke="#1e3a5f" stroke-width="2"/>

    <!-- Oxygen molecule -->
    <line x1="285" y1="235" x2="350" y2="235"
          stroke="#1f2937" stroke-width="6"/>

    <circle cx="260" cy="235" r="31"
            fill="#fca5a5" stroke="#991b1b" stroke-width="2"/>

    <circle cx="375" cy="235" r="31"
            fill="#fca5a5" stroke="#991b1b" stroke-width="2"/>

    <!-- Reaction arrow -->
    <line
        x1="455" y1="240" x2="545" y2="240"
        stroke="#1f2937"
        stroke-width="6"
        marker-end="url(#reaction-arrow)"
    />

    <!-- Water molecule 1 -->
    <line x1="675" y1="185" x2="730" y2="220"
          stroke="#1f2937" stroke-width="5"/>

    <line x1="820" y1="185" x2="765" y2="220"
          stroke="#1f2937" stroke-width="5"/>

    <circle cx="650" cy="170" r="24"
            fill="#dbeafe" stroke="#1e3a5f" stroke-width="2"/>

    <circle cx="750" cy="235" r="31"
            fill="#fca5a5" stroke="#991b1b" stroke-width="2"/>

    <circle cx="845" cy="170" r="24"
            fill="#dbeafe" stroke="#1e3a5f" stroke-width="2"/>

    <!-- Water molecule 2 -->
    <line x1="675" y1="305" x2="730" y2="340"
          stroke="#1f2937" stroke-width="5"/>

    <line x1="820" y1="305" x2="765" y2="340"
          stroke="#1f2937" stroke-width="5"/>

    <circle cx="650" cy="290" r="24"
            fill="#dbeafe" stroke="#1e3a5f" stroke-width="2"/>

    <circle cx="750" cy="355" r="31"
            fill="#fca5a5" stroke="#991b1b" stroke-width="2"/>

    <circle cx="845" cy="290" r="24"
            fill="#dbeafe" stroke="#1e3a5f" stroke-width="2"/>

    <!-- Equation -->
    <text
        x="500" y="450"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="21"
        font-weight="bold"
        fill="#1e3a5f"
    >
        2H₂ + O₂ → 2H₂O
    </text>
</svg>
