<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 1100 400"
    role="img"
    aria-labelledby="title description"
>
    <title id="title">The pH scale</title>

    <desc id="description">
        A pH scale from zero through fourteen showing acidic values
        below seven, neutral at seven, and basic values above seven.
    </desc>

    <rect width="1100" height="400" fill="#ffffff"/>

    <text
        x="550"
        y="42"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="28"
        font-weight="bold"
        fill="#1f2937"
    >
        The pH Scale at 25°C
    </text>

    <rect
        x="30"
        y="70"
        width="1040"
        height="290"
        rx="14"
        fill="#f8fafc"
        stroke="#cbd9e8"
        stroke-width="2"
    />

    <!-- Scale blocks -->

    <g stroke="#ffffff" stroke-width="2">

        <rect x="70" y="155" width="64" height="75" fill="#b91c1c"/>
        <rect x="134" y="155" width="64" height="75" fill="#dc2626"/>
        <rect x="198" y="155" width="64" height="75" fill="#ea580c"/>
        <rect x="262" y="155" width="64" height="75" fill="#f97316"/>
        <rect x="326" y="155" width="64" height="75" fill="#f59e0b"/>
        <rect x="390" y="155" width="64" height="75" fill="#eab308"/>
        <rect x="454" y="155" width="64" height="75" fill="#84cc16"/>

        <rect x="518" y="155" width="64" height="75" fill="#22c55e"/>

        <rect x="582" y="155" width="64" height="75" fill="#14b8a6"/>
        <rect x="646" y="155" width="64" height="75" fill="#06b6d4"/>
        <rect x="710" y="155" width="64" height="75" fill="#0ea5e9"/>
        <rect x="774" y="155" width="64" height="75" fill="#3b82f6"/>
        <rect x="838" y="155" width="64" height="75" fill="#6366f1"/>
        <rect x="902" y="155" width="64" height="75" fill="#7c3aed"/>
        <rect x="966" y="155" width="64" height="75" fill="#6d28d9"/>

    </g>

    <!-- Numbers -->

    <g
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="18"
        font-weight="bold"
        fill="#ffffff"
    >
        <text x="102" y="201">0</text>
        <text x="166" y="201">1</text>
        <text x="230" y="201">2</text>
        <text x="294" y="201">3</text>
        <text x="358" y="201">4</text>
        <text x="422" y="201">5</text>
        <text x="486" y="201">6</text>
        <text x="550" y="201">7</text>
        <text x="614" y="201">8</text>
        <text x="678" y="201">9</text>
        <text x="742" y="201">10</text>
        <text x="806" y="201">11</text>
        <text x="870" y="201">12</text>
        <text x="934" y="201">13</text>
        <text x="998" y="201">14</text>
    </g>

    <!-- Category labels -->

    <text
        x="294"
        y="125"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="23"
        font-weight="bold"
        fill="#b91c1c"
    >
        Acidic
    </text>

    <text
        x="550"
        y="125"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="23"
        font-weight="bold"
        fill="#15803d"
    >
        Neutral
    </text>

    <text
        x="806"
        y="125"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="23"
        font-weight="bold"
        fill="#4338ca"
    >
        Basic
    </text>

    <!-- Explanations -->

    <text
        x="294"
        y="275"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="18"
        fill="#4b5563"
    >
        [H₃O⁺] &gt; [OH⁻]
    </text>

    <text
        x="550"
        y="275"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="18"
        fill="#4b5563"
    >
        [H₃O⁺] = [OH⁻]
    </text>

    <text
        x="806"
        y="275"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="18"
        fill="#4b5563"
    >
        [OH⁻] &gt; [H₃O⁺]
    </text>

    <text
        x="550"
        y="325"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="18"
        font-weight="bold"
        fill="#1f2937"
    >
        Each pH unit represents a tenfold change in [H₃O⁺]
    </text>

</svg>
