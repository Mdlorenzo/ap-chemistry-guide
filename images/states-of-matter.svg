<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 1050 520"
    role="img"
    aria-labelledby="title description"
>
    <title id="title">Particle diagrams of states of matter</title>

    <desc id="description">
        A solid contains closely packed ordered particles, a liquid
        contains closely packed disordered particles, and a gas contains
        widely separated particles in random motion.
    </desc>

    <defs>
        <marker
            id="motion-arrow"
            markerWidth="8"
            markerHeight="8"
            refX="7"
            refY="3"
            orient="auto"
        >
            <path d="M0,0 L0,6 L8,3 z" fill="#991b1b"/>
        </marker>
    </defs>

    <rect width="1050" height="520" fill="#ffffff"/>

    <text
        x="525" y="38"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="26"
        font-weight="bold"
        fill="#1f2937"
    >
        Particle Models of the States of Matter
    </text>

    <!-- Containers -->
    <g fill="#f8fafc" stroke="#1e3a5f" stroke-width="3">
        <rect x="35" y="105" width="300" height="320" rx="8"/>
        <rect x="375" y="105" width="300" height="320" rx="8"/>
        <rect x="715" y="105" width="300" height="320" rx="8"/>
    </g>

    <!-- Titles -->
    <g
        font-family="Arial, sans-serif"
        font-size="22"
        font-weight="bold"
        fill="#1e3a5f"
        text-anchor="middle"
    >
        <text x="185" y="88">Solid</text>
        <text x="525" y="88">Liquid</text>
        <text x="865" y="88">Gas</text>
    </g>

    <!-- Solid particles -->
    <g fill="#93c5fd" stroke="#1e3a5f" stroke-width="2">
        <circle cx="105" cy="235" r="27"/>
        <circle cx="165" cy="235" r="27"/>
        <circle cx="225" cy="235" r="27"/>
        <circle cx="285" cy="235" r="27"/>

        <circle cx="105" cy="295" r="27"/>
        <circle cx="165" cy="295" r="27"/>
        <circle cx="225" cy="295" r="27"/>
        <circle cx="285" cy="295" r="27"/>

        <circle cx="105" cy="355" r="27"/>
        <circle cx="165" cy="355" r="27"/>
        <circle cx="225" cy="355" r="27"/>
        <circle cx="285" cy="355" r="27"/>
    </g>

    <!-- Liquid particles -->
    <g fill="#93c5fd" stroke="#1e3a5f" stroke-width="2">
        <circle cx="430" cy="365" r="27"/>
        <circle cx="490" cy="350" r="27"/>
        <circle cx="550" cy="370" r="27"/>
        <circle cx="615" cy="350" r="27"/>

        <circle cx="445" cy="305" r="27"/>
        <circle cx="510" cy="290" r="27"/>
        <circle cx="575" cy="310" r="27"/>
        <circle cx="635" cy="290" r="27"/>

        <circle cx="470" cy="240" r="27"/>
        <circle cx="535" cy="230" r="27"/>
        <circle cx="600" cy="245" r="27"/>
        <circle cx="625" cy="185" r="27"/>
    </g>

    <!-- Gas particles -->
    <g fill="#93c5fd" stroke="#1e3a5f" stroke-width="2">
        <circle cx="770" cy="165" r="20"/>
        <circle cx="875" cy="145" r="20"/>
        <circle cx="960" cy="200" r="20"/>

        <circle cx="820" cy="265" r="20"/>
        <circle cx="940" cy="300" r="20"/>

        <circle cx="765" cy="375" r="20"/>
        <circle cx="870" cy="350" r="20"/>
        <circle cx="980" cy="390" r="20"/>

        <circle cx="900" cy="235" r="20"/>
        <circle cx="795" cy="210" r="20"/>
        <circle cx="850" cy="405" r="20"/>
        <circle cx="980" cy="125" r="20"/>
    </g>

    <!-- Gas motion arrows -->
    <g
        stroke="#991b1b"
        stroke-width="3"
        marker-end="url(#motion-arrow)"
    >
        <line x1="770" y1="140" x2="745" y2="120"/>
        <line x1="875" y1="120" x2="900" y2="105"/>
        <line x1="960" y1="175" x2="985" y2="155"/>
        <line x1="820" y1="240" x2="795" y2="220"/>
        <line x1="940" y1="275" x2="965" y2="255"/>
        <line x1="765" y1="350" x2="745" y2="330"/>
        <line x1="870" y1="325" x2="895" y2="305"/>
        <line x1="980" y1="365" x2="995" y2="345"/>
    </g>

    <!-- Descriptions -->
    <g
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#4b5563"
        text-anchor="middle"
    >
        <text x="185" y="465">Ordered and closely packed</text>
        <text x="525" y="465">Close but able to flow</text>
        <text x="865" y="465">Widely separated and moving</text>
    </g>
</svg>
