<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 1100 610"
    role="img"
    aria-labelledby="title description"
>
    <title id="title">Acid-base titration curves</title>

    <desc id="description">
        Two titration curves compare a strong acid titrated with a
        strong base and a weak acid titrated with a strong base.
        Equivalence points, the buffer region, and the half-equivalence
        point are labeled.
    </desc>

    <rect width="1100" height="610" fill="#ffffff"/>

    <text
        x="550"
        y="40"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="28"
        font-weight="bold"
        fill="#1f2937"
    >
        Acid–Base Titration Curves
    </text>

    <!-- Panel backgrounds -->

    <rect
        x="25"
        y="70"
        width="515"
        height="500"
        rx="14"
        fill="#f8fafc"
        stroke="#cbd9e8"
        stroke-width="2"
    />

    <rect
        x="560"
        y="70"
        width="515"
        height="500"
        rx="14"
        fill="#f8fafc"
        stroke="#cbd9e8"
        stroke-width="2"
    />

    <!-- Left title -->

    <text
        x="282"
        y="105"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="21"
        font-weight="bold"
        fill="#1e3a5f"
    >
        Strong Acid–Strong Base
    </text>

    <!-- Left axes -->

    <line x1="90" y1="490" x2="505" y2="490"
          stroke="#1f2937" stroke-width="3"/>

    <line x1="90" y1="490" x2="90" y2="125"
          stroke="#1f2937" stroke-width="3"/>

    <text x="300" y="535"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="17"
          fill="#1f2937">
        Volume of Strong Base Added
    </text>

    <text x="52" y="310"
          text-anchor="middle"
          transform="rotate(-90 52 310)"
          font-family="Arial, sans-serif"
          font-size="19"
          fill="#1f2937">
        pH
    </text>

    <!-- pH 7 reference -->

    <line x1="90" y1="310" x2="505" y2="310"
          stroke="#94a3b8" stroke-width="2"
          stroke-dasharray="8 8"/>

    <text x="80" y="316"
          text-anchor="end"
          font-family="Arial, sans-serif"
          font-size="16"
          fill="#4b5563">
        7
    </text>

    <!-- Left equivalence line -->

    <line x1="315" y1="135" x2="315" y2="490"
          stroke="#64748b" stroke-width="2"
          stroke-dasharray="8 8"/>

    <!-- Left curve -->

    <path
        d="M 110 455
           C 200 450, 260 435, 295 395
           C 308 375, 312 335, 315 310
           C 318 265, 323 205, 340 170
           C 375 135, 430 130, 490 128"
        fill="none"
        stroke="#2563eb"
        stroke-width="7"
        stroke-linecap="round"
    />

    <circle cx="315" cy="310" r="8" fill="#dc2626"/>

    <text x="330" y="295"
          font-family="Arial, sans-serif"
          font-size="16"
          font-weight="bold"
          fill="#dc2626">
        Equivalence: pH 7
    </text>


    <!-- Right title -->

    <text
        x="817"
        y="105"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="21"
        font-weight="bold"
        fill="#1e3a5f"
    >
        Weak Acid–Strong Base
    </text>

    <!-- Right axes -->

    <line x1="625" y1="490" x2="1040" y2="490"
          stroke="#1f2937" stroke-width="3"/>

    <line x1="625" y1="490" x2="625" y2="125"
          stroke="#1f2937" stroke-width="3"/>

    <text x="835" y="535"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="17"
          fill="#1f2937">
        Volume of Strong Base Added
    </text>

    <text x="587" y="310"
          text-anchor="middle"
          transform="rotate(-90 587 310)"
          font-family="Arial, sans-serif"
          font-size="19"
          fill="#1f2937">
        pH
    </text>

    <!-- Right pH 7 reference -->

    <line x1="625" y1="310" x2="1040" y2="310"
          stroke="#94a3b8" stroke-width="2"
          stroke-dasharray="8 8"/>

    <text x="615" y="316"
          text-anchor="end"
          font-family="Arial, sans-serif"
          font-size="16"
          fill="#4b5563">
        7
    </text>

    <!-- Half-equivalence and equivalence lines -->

    <line x1="760" y1="135" x2="760" y2="490"
          stroke="#16a34a" stroke-width="2"
          stroke-dasharray="8 8"/>

    <line x1="895" y1="135" x2="895" y2="490"
          stroke="#64748b" stroke-width="2"
          stroke-dasharray="8 8"/>

    <!-- Right curve -->

    <path
        d="M 645 420
           C 680 390, 725 370, 760 360
           C 815 345, 860 325, 880 285
           C 891 260, 894 225, 895 205
           C 900 170, 920 140, 1025 128"
        fill="none"
        stroke="#7c3aed"
        stroke-width="7"
        stroke-linecap="round"
    />

    <!-- Important points -->

    <circle cx="760" cy="360" r="8" fill="#16a34a"/>
    <circle cx="895" cy="205" r="8" fill="#dc2626"/>

    <text x="675" y="345"
          font-family="Arial, sans-serif"
          font-size="15"
          font-weight="bold"
          fill="#15803d">
        Half-equivalence
    </text>

    <text x="675" y="365"
          font-family="Arial, sans-serif"
          font-size="15"
          font-weight="bold"
          fill="#15803d">
        pH = pKₐ
    </text>

    <text x="905" y="195"
          font-family="Arial, sans-serif"
          font-size="15"
          font-weight="bold"
          fill="#dc2626">
        Equivalence
    </text>

    <text x="905" y="215"
          font-family="Arial, sans-serif"
          font-size="15"
          font-weight="bold"
          fill="#dc2626">
        pH &gt; 7
    </text>

    <text x="775" y="405"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="16"
          font-weight="bold"
          fill="#4b5563">
        Buffer region
    </text>

</svg>
