<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 800 700"
    role="img"
    aria-labelledby="title description"
>
    <title id="title">Titration setup</title>

    <desc id="description">
        A burette containing titrant is supported above an Erlenmeyer
        flask containing the analyte.
    </desc>

    <rect width="800" height="700" fill="#ffffff"/>

    <text
        x="400" y="40"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="26"
        font-weight="bold"
        fill="#1f2937"
    >
        Titration Setup
    </text>

    <!-- Support stand -->
    <line x1="165" y1="100" x2="165" y2="620"
          stroke="#374151" stroke-width="12"/>

    <line x1="85" y1="620" x2="250" y2="620"
          stroke="#374151" stroke-width="16"/>

    <!-- Clamp -->
    <line x1="165" y1="190" x2="330" y2="190"
          stroke="#4b5563" stroke-width="9"/>

    <rect x="315" y="170" width="45" height="40"
          fill="#9ca3af" stroke="#374151" stroke-width="3"/>

    <!-- Burette -->
    <rect
        x="340" y="90" width="55" height="390"
        fill="#dbeafe" fill-opacity="0.65"
        stroke="#1e3a5f" stroke-width="4"
    />

    <!-- Burette markings -->
    <g stroke="#1e3a5f" stroke-width="2">
        <line x1="340" y1="130" x2="360" y2="130"/>
        <line x1="340" y1="170" x2="360" y2="170"/>
        <line x1="340" y1="210" x2="360" y2="210"/>
        <line x1="340" y1="250" x2="360" y2="250"/>
        <line x1="340" y1="290" x2="360" y2="290"/>
        <line x1="340" y1="330" x2="360" y2="330"/>
        <line x1="340" y1="370" x2="360" y2="370"/>
        <line x1="340" y1="410" x2="360" y2="410"/>
        <line x1="340" y1="450" x2="360" y2="450"/>
    </g>

    <!-- Stopcock -->
    <line x1="367" y1="480" x2="367" y2="515"
          stroke="#1f2937" stroke-width="7"/>

    <line x1="330" y1="495" x2="405" y2="495"
          stroke="#991b1b" stroke-width="8"/>

    <!-- Burette tip -->
    <polygon
        points="355,515 380,515 370,560 365,560"
        fill="#dbeafe"
        stroke="#1e3a5f"
        stroke-width="3"
    />

    <!-- Drop -->
    <path
        d="M368 575
           C355 592, 357 606, 368 610
           C379 606, 381 592, 368 575"
        fill="#3b82f6"
    />

    <!-- Erlenmeyer flask -->
    <path
        d="M330 615
           L350 545
           L350 525
           L385 525
           L385 545
           L415 615
           Q425 645 395 650
           L350 650
           Q320 645 330 615"
        fill="#ffffff"
        stroke="#1e3a5f"
        stroke-width="4"
    />

    <!-- Analyte liquid -->
    <path
        d="M335 610
           L408 610
           Q420 640 395 644
           L350 644
           Q325 640 335 610"
        fill="#fca5a5"
        fill-opacity="0.75"
    />

    <!-- Labels -->
    <text
        x="500" y="210"
        font-family="Arial, sans-serif"
        font-size="20"
        font-weight="bold"
        fill="#1e3a5f"
    >
        Burette
    </text>

    <text
        x="500" y="240"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#4b5563"
    >
        Contains titrant
    </text>

    <line x1="465" y1="220" x2="400" y2="220"
          stroke="#4b5563" stroke-width="2"/>

    <text
        x="500" y="500"
        font-family="Arial, sans-serif"
        font-size="20"
        font-weight="bold"
        fill="#991b1b"
    >
        Stopcock
    </text>

    <line x1="470" y1="495" x2="410" y2="495"
          stroke="#4b5563" stroke-width="2"/>

    <text
        x="500" y="600"
        font-family="Arial, sans-serif"
        font-size="20"
        font-weight="bold"
        fill="#1e3a5f"
    >
        Analyte
    </text>

    <text
        x="500" y="628"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="#4b5563"
    >
        Unknown concentration
    </text>

    <line x1="470" y1="605" x2="420" y2="620"
          stroke="#4b5563" stroke-width="2"/>
</svg>
